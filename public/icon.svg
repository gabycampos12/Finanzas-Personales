<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Decorative circle -->
  <circle cx="256" cy="256" r="180" fill="url(#accent)" opacity="0.15"/>
  <!-- Wallet / Bank card glyph -->
  <rect x="116" y="156" width="280" height="200" rx="28" fill="url(#accent)"/>
  <rect x="116" y="200" width="280" height="40" fill="#0f172a" opacity="0.25"/>
  <!-- Card chip / clasp -->
  <rect x="300" y="226" width="68" height="60" rx="14" fill="#ffffff"/>
  <circle cx="334" cy="256" r="10" fill="#0f172a"/>
  <!-- Trend arrow upward -->
  <path d="M156 300 L216 240 L266 270 L346 190" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M306 190 L346 190 L346 230" stroke="#ffffff" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
